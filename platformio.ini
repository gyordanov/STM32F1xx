# This is the configuration file for PlatformIO, a cross-platform tool and IDE
# to build and develop software for embedded systems.
#
# To build the firmware with PlatformIO, install PlatformIO Core (CLI, no GUI):
# - https://docs.platformio.org/en/latest//core/installation.html
#
# For documentation on this file, see:
# - https://docs.platformio.org/en/latest/projectconf/index.html
#
# To add support for another STM32F1xx board, add a new [env:name..] section
# with the appropriate `board` and (optionally) `board_build.ldscript`.
# For a list of supported hardware, see:
# - https://docs.platformio.org/en/latest/platforms/ststm32.html
#
# To add support for additional grblHAL plugins or drivers, make the necessary
# changes to the common.build_flags, common.lib_deps and common.lib_extra_dirs
# below.
#
# By default this file sets the preprocessor directive `OVERRIDE_MY_MACHINE`
# to ignore all settings in `Inc/my_machine.h`.  Instead, you should edit this
# file and add the necessary directives (e.g. `-D FOOBAR_ENABLE`) to either
# `common.build_flags` or the environment specific `build_flags`.
#
# Typical command line usage:
#
#    # Build firmware for all defined environments
#    pio run
#    # Build only for specific environments with the -e option
#    pio run -e BTT_SKR_MINI_E3_V20 -e BTT_SKR_MINI_E3_V20_USB
#    # List the freshly built firmware ELF (.elf) and binary (.bin) files:
#    ls -l .pio/build/*/firmware.*
#    # If the target supports uploading (via `upload_protocol`):
#    pio run -e bluepill_f103c8_128k -t upload
#    # Clean up build related resources
#    pio run -t clean
#

#
# NOTE: PlatformIO support is provided by the community and platformio.ini is
# not maintained or tested by the repo owner.
# Please submit a PR with bug fixes and enhancments.
#

[platformio]
include_dir = Inc
src_dir = Src

[common]
build_flags =
  -I .
  -I boards
  -I FatFs
  -I Middlewares/ST/STM32_USB_Device_Library/Class/CDC/Inc
  -I Middlewares/ST/STM32_USB_Device_Library/Core/Inc
  -I USB_DEVICE/Target
  -D RX_BUFFER_SIZE=512
  -D NVS_SIZE=1536
  # Ignore all settings in Inc/my_machine.h (and instead use the below build flags)
  -D OVERRIDE_MY_MACHINE
  # Uncomment to enable debug builds
  #-D DEBUG
  # Uncomment to enable support for keypad
  #-D KEYPAD_ENABLE=1
  # Uncomment to enable support for odometer
  #-D ODOMETER_ENABLE=1
  # Uncomment to enable support for running G-code from the microSD card
  # You also need to uncomment FatFs and sdcard in lib_deps (see below)
  #-D SDCARD_ENABLE=1
lib_deps =
  boards
  grbl
  keypad
  motors
  odometer
  plugins
# To enable support for SD card uncomment `FatFs` and `sdcard` below.
  #FatFs
  #sdcard
  # USB serial support
  Core
  Class
  App
  Target
lib_extra_dirs =
  .
  FatFs
  Middlewares/ST/STM32_USB_Device_Library
  USB_DEVICE

[env]
platform = ststm32
framework = stm32cube
# Do not produce .a files for lib deps (which would prevent them from overriding weak symbols)
lib_archive = no
lib_ldf_mode = off

[env:BTT_SKR_MINI_E3_V20]
board = genericSTM32F103RC
board_build.ldscript = STM32F103RCTX_FLASH.ld
build_flags = ${common.build_flags}
  # See Inc/my_machine.h for options
  -D BOARD_BTT_SKR_MINI_E3_V20=
  -D USB_SERIAL_CDC=0
  # Relocate the vector table where the boot loader expects to find them
  -D VECT_TAB_OFFSET=0x7000
  -Wl,--defsym=LD_VECT_TAB_OFFSET=0x7000
lib_deps = ${common.lib_deps}
  eeprom
  trinamic
lib_extra_dirs = ${common.lib_extra_dirs}
# Upload is not supported for this board since BOOT0 is tied to GND.
# With the default boot loader, you must deploy new firmware by copying
# .pio/build/<env name>/firmware.bin (produced by `pio run`) to the SD card.

[env:BTT_SKR_MINI_E3_V20_USB]
board = genericSTM32F103RC
board_build.ldscript = STM32F103RCTX_FLASH.ld
build_flags = ${common.build_flags}
  # See Inc/my_machine.h for options
  -D BOARD_BTT_SKR_MINI_E3_V20=
  -D USB_SERIAL_CDC=1
  # Relocate the vector table where the boot loader expects to find them
  -D VECT_TAB_OFFSET=0x7000
  -Wl,--defsym=LD_VECT_TAB_OFFSET=0x7000
lib_deps = ${common.lib_deps}
  eeprom
  trinamic
lib_extra_dirs = ${common.lib_extra_dirs}
# Upload is not supported for this board since BOOT0 is tied to GND.
# With the default boot loader, you must deploy new firmware by copying
# .pio/build/<env name>/firmware.bin (produced by `pio run`) to the SD card.

# HiMill D1 / D1S — STM32F103RCT6 (256 KB flash, 48 KB RAM), 8 MHz HSE.
# TMC drivers in STANDALONE mode — trinamic plugin intentionally OFF.
# Native USB CDC on PA11/PA12 is the primary serial. Secondary UART to
# the ESP32 WiFi module sits on PA2/PA3 (USART2, 115200) — see
# boards/himill_d1s_map.h for the full pin description.
#
# The VECT_TAB_OFFSET below co-exists with HiMill's stock bootloader at
# 0x08000000: HiMill_D1_Boot-v1.4-hw_v1.0.hex occupies ~16 KB, but the
# vendor app lives at 0x08008000. If you flash this .bin directly via ST-LINK
# at 0x08000000, it REPLACES the HiMill bootloader — pick your path.
[env:himill_d1s]
board = genericSTM32F103RC
board_build.ldscript = STM32F103RCTX_HIMILL_D1S_FLASH.ld
build_flags = ${common.build_flags}
  # ----- Board / MCU -----
  -D BOARD_HIMILL_D1S=
  # USB CDC for ESP3D bootstrap (WiFi config). Mux + DTR-based switching
  # in himill_d1s.c keeps UART2 primary by default and switches to USB
  # CDC when a host opens /dev/ttyACM0.
  -D USB_SERIAL_CDC=1
  -D HSE_VALUE=8000000
  # Larger TX buffer to absorb settings enumeration bursts without ever
  # blocking — at 115200 baud UART2 drains slowly, and any blocking
  # during long output exposes race conditions / reset triggers we
  # haven't isolated yet. 8KB fits a complete D1S settings dump once
  # long setting descriptions are compiled out below.
  # NOTE: must be a power of 2.
  -D TX_BUFFER_SIZE=8192
  -D N_AXIS=4
  # D1S has no dedicated coolant pins — disable the feature outright so
  # the driver doesn't look for COOLANT_FLOOD_PORT/COOLANT_MIST_PORT.
  -D COOLANT_ENABLE=0
  # SAFETY_DOOR intentionally OFF: PB1 (door switch) shares EXTI line 1
  # with PC1 (Y limit). STM32F1 forces aux inputs that collide with
  # limits/devices into IRQ_Mode_None, and grblHAL only assigns the
  # SafetyDoor function when IRQ is available — so door would degrade
  # to a generic aux input regardless. Treat PB1 as auxin (P1) and bind
  # door behaviour via the macros plugin if needed later.
  # -D SAFETY_DOOR_ENABLE=1   # DISABLED — won't bind on this board
  #
  # Two probe inputs: PA1 (HiMill TOOL_SETTER) → TOOLSETTER for tool-tip
  # length offsets; PB2 (HiMill 3D_PROBE) → PROBE for G38 work-edge probing.
  # Both pin numbers collide with limits on EXTI but probe-type aux inputs
  # are allowed in polled mode (driver.c:1054-1056), so this works.
  -D TOOLSETTER_ENABLE=1
  # Macros plugin: pin-bound, polled. Lets the user wire any aux input
  # (e.g. PB1 inside-door button) to a predefined action like Cycle Start
  # via $-settings at runtime. We can't bind CYCLE_START_PIN directly on
  # this board (EXTI collision with limits), but the macros plugin does
  # the same job via polling. 2 macro slots — bit 0 = pin macros.
  -D MACROS_ENABLE=1
  # Rotation handling for the A axis (work-coord rotation, fast G28 jog,
  # M3-axis virtualisation). NOTE: enabling this changes the NVS layout —
  # back up `$$` before flashing, do `$RST=$` after first boot, restore
  # values from the backup. Otherwise stale settings come back garbled.
  -D ROTATION_ENABLE=1
  # Probe overshoot mitigation: at the slow-feed approach, grblHAL caps
  # the planner's deceleration window so the probe stops exactly on
  # contact instead of overshooting by a step or two of latency.
  -D MINIMIZE_PROBE_OVERSHOOT=1
  # Drop only the long human-readable setting descriptions used by $ESH
  # and per-setting help. Setting names, groups, units, formats, bounds
  # and values remain enumerable; this saves enough flash to keep macros.
  -D NO_SETTINGS_DESCRIPTIONS=1
  # NGC expressions are useful for probing macros. With the long setting
  # descriptions omitted above, they fit while keeping RGB and macros.
  -D NGC_EXPRESSIONS_ENABLE=1
  # E-stop bound on PB4 (CONTROL_ESTOP = 1<<6). The earlier $esh-stops
  # cascade turned out to be a stream-mux bug (write_n bypassing our
  # wrapper), not e-stop EMI — fixed by Codex's mux completeness audit
  # in himill_d1s.c. With that resolved, restore the real e-stop signal
  # so pressing the button is the world-ending alarm it's supposed to be.
  -D CONTROL_ENABLE=64
  # ESP3D bridge: USART2 on PA2/PA3 → ESP32 module. Coexists with the
  # USB-CDC primary stream — the UART becomes a SECONDARY stream that
  # ESP3D consumes for telnet + websocket bridging.
  -D SERIAL_PORT=2
  # MPG/DRO pendant on UART4 (PC10 TX / PC11 RX) → rear GX12-4P jack
  # (5V / TX / RX / GND). Nick Shilov's SmartPendant target. SERIAL1_PORT=4
  # claims UART4 as the second UART instance; serial.c:170-179 already has
  # the pin and clock mapping. UART4 TX uses TX_BUFFER1_SIZE (1 KB default
  # in serial.c) instead of TX_BUFFER_SIZE (8 KB on this board) — two 8 KB
  # TX buffers don't fit on F103RC's 48 KB RAM and cause $$ over telnet
  # to lock up at $5=7. MPG_ENABLE=2 = software toggle via the 0x8B
  # realtime byte (no MPG_MODE_PIN required, fits the 4-wire jack).
  # MPG_STREAM=1 binds the MPG plugin to instance 1 (= SERIAL1_PORT) so
  # USART2/ESP3D at instance 0 stays untouched. NOTE: grbl/changelog.md
  # flags STM32F1xx UART4 as "tentative, not tested" — first F1 user.
  -D SERIAL1_PORT=4
  -D MPG_ENABLE=2
  -D MPG_STREAM=1
  # SD card on SPI1 primary pins (PA5/6/7 + PA4 CS) — for $F gcode runs
  # and gusender's /SD HTTP endpoint.
  -D SDCARD_ENABLE=1
  # D1S WS2812 LEDs: front 24-pixel strip on PB5 and internal cycle-button
  # pixel on PB15. Board code supplies the HAL RGB backend; plugin adds M150.
  -D RGB_LED_ENABLE=2
  -D DEFAULT_RGB_STRIP0_LENGTH=24
  -D DEFAULT_RGB_STRIP1_LENGTH=1
  # A axis rotary ($376=8) — disables mm scaling under inches mode for A.
  -D DEFAULT_AXIS_ROTATIONAL_MASK=8
  # Co-exist with HiMill's stock bootloader at 0x08000000. The bootloader
  # code itself only fills ~16 KB (0x0000-0x3E10 in their .hex), but the
  # app jumps to 0x08008000 — verified from the reset vector in MaxMake's
  # official app binary v1.0.34 (reset handler at 0x08008148). The gap
  # between 0x4000 and 0x8000 appears to be reserved for bootloader
  # scratch or forced alignment. Our app must match their offset.
  -D VECT_TAB_OFFSET=0x8000
  -Wl,--defsym=LD_VECT_TAB_OFFSET=0x8000
  # ----- Baked $ defaults (bring-up validated 2026-04-24) -----
  # NOTE: settings.c only includes hal.h — DEFAULT_* defines in the map
  # header (himill_d1s_map.h) NEVER reach settings.c. Build flags do.
  # See docs/controllers/himill_d1s.md for the rationale of each value.
  # Soft-limit jogging + manual toolchange ($40, $341, $346).
  -D DEFAULT_JOG_LIMIT_ENABLE=On                   # $40: soft-limit-checked jogging
  -D DEFAULT_TOOLCHANGE_MODE=3                     # $341: auto touch-off with toolsetter
  # $342 = 65 mm (was 30 default). Validated 2026-05-01: with G59.3 Z
  # seeded at -15 mm (see board_init coord-defaults seed), the toolsetter
  # search distance at the probe-down phase needs to span a longer range
  # than grblHAL's stock 30 mm or the probe alarms before contact.
  -D DEFAULT_TOOLCHANGE_PROBING_DISTANCE=65.0f     # $342
  # $343..$345 (feed/seek/pulloff) intentionally NOT overridden —
  # grblHAL's built-in defaults (25 / 200 / 200) already match validated
  # D1S values.
  -D DEFAULT_TOOLCHANGE_AT_G30=On                  # $346 bit1: toolsetter location lives at G30
  -D DEFAULT_TOOLCHANGE_FAST_PROBE_PULLOFF=On      # $346 bit2: fast pull-off after probe contact
  # Step pulse / idle
  -D DEFAULT_STEP_PULSE_MICROSECONDS=7.0f          # $0
  # $1=255 → steppers stay energised indefinitely. Required for the
  # D1S TMCs in standalone mode; otherwise Z drops on idle release.
  -D DEFAULT_STEPPER_IDLE_LOCK_TIME=255            # $1: hold forever
  -D DEFAULT_STEP_PULSE_DELAY=5.0f                 # $29
  # Pin invert masks
  -D DEFAULT_STEP_SIGNALS_INVERT_MASK=0            # $2
  -D DEFAULT_DIR_SIGNALS_INVERT_MASK=2             # $3: Y motor reversed (matches stock D1S wiring)
  -D DEFAULT_ENABLE_SIGNALS_INVERT_MASK=15         # $4: XYZA enable inverted
  -D DEFAULT_LIMIT_SIGNALS_INVERT_MASK=7           # $5: XYZ NC switches
  -D DEFAULT_CONTROL_SIGNALS_INVERT_MASK=64        # $14: bit6 = e-stop
  -D DEFAULT_PROBE_SIGNAL_INVERT=On                # $6: HiMill 3D probe is active-low
  # Reporting
  -D DEFAULT_REPORT_INCHES=Off                     # $13: metric
  -D DEFAULT_JUNCTION_DEVIATION=0.010f             # $11
  -D DEFAULT_ARC_TOLERANCE=0.002f                  # $12
  # Limits / homing  (currently OFF for bring-up — re-enable once
  # switches are validated end-to-end)
  -D DEFAULT_SOFT_LIMIT_ENABLE=Off                 # $20
  -D DEFAULT_HARD_LIMIT_ENABLE=On                  # $21: enabled
  -D DEFAULT_HOMING_ENABLE=On                      # $22 bit 0
  -D DEFAULT_HOMING_SINGLE_AXIS_COMMANDS=On        # $22 bit 1
  -D DEFAULT_HOMING_ALLOW_MANUAL=On                # $22 bit 3
  -D DEFAULT_LIMITS_TWO_SWITCHES_ON_AXES=Off       # $22 bit 5 set per stock dump (43 = 0+1+3+5)
  -D DEFAULT_HOMING_DIR_MASK=1                     # $23: X home toward -, Y home toward + (paired with $3=2)
  -D DEFAULT_HOMING_FEED_RATE=25.0f                # $24
  -D DEFAULT_HOMING_SEEK_RATE=500.0f               # $25
  -D DEFAULT_HOMING_DEBOUNCE_DELAY=250             # $26
  -D DEFAULT_HOMING_PULLOFF=1.0f                   # $27
  -D DEFAULT_HOMING_CYCLE_0=4                      # $43+$44: Z (Z_AXIS_BIT)
  -D DEFAULT_HOMING_CYCLE_1=3                      # $43+$45: X+Y (X_AXIS_BIT|Y_AXIS_BIT)
  -D DEFAULT_HOMING_CYCLE_2=0                      # $43+$46: unused
  # Spindle envelope + ramping
  -D DEFAULT_SPINDLE_RPM_MAX=13000.0f              # $30
  -D DEFAULT_SPINDLE_RPM_MIN=0.0f                  # $31
  -D DEFAULT_LASER_MODE=Off                        # $32
  -D DEFAULT_INVERT_SPINDLE_PWM_PIN=On             # $16 bit 2
  -D DEFAULT_SPINDLE_PWM_FREQ=10000                # $33: 10 kHz
  -D DEFAULT_SPINDLE_PWM_OFF_VALUE=0.0f            # $34
  -D DEFAULT_SPINDLE_PWM_MIN_VALUE=0.0f            # $35
  -D DEFAULT_SPINDLE_PWM_MAX_VALUE=99.0f           # $36: 99% (100% kills PWM toggle, drives chip into DC)
  # Bit 2 ($9=4 "Disable laser mode") intentionally NOT set — we want
  # users to be able to flip $32=1 for the laser head.
  -D DEFAULT_PWM_SPINDLE_ENABLE_RAMP=On            # $9 bit 3
  -D DEFAULT_SPINDLE_ON_DELAY=1000                 # $394: 1.0s ramp-up
  -D DEFAULT_SPINDLE_OFF_DELAY=1000                # $539: 1.0s ramp-down
  # Per-axis calibration
  -D DEFAULT_X_STEPS_PER_MM=1600.0f                # $100
  -D DEFAULT_Y_STEPS_PER_MM=1600.0f                # $101
  -D DEFAULT_Z_STEPS_PER_MM=1600.0f                # $102
  -D DEFAULT_A_STEPS_PER_MM=88.889f                # $103: 4.05 step/deg
  -D DEFAULT_X_MAX_RATE=2000.0f                    # $110: TMCs in fast mode → 2000
  -D DEFAULT_Y_MAX_RATE=2000.0f                    # $111
  -D DEFAULT_Z_MAX_RATE=1500.0f                    # $112: Z slightly below XY (gravity load)
  -D DEFAULT_A_MAX_RATE=2000.0f                    # $113
  -D DEFAULT_X_ACCELERATION=500.0f                 # $120
  -D DEFAULT_Y_ACCELERATION=500.0f                 # $121
  -D DEFAULT_Z_ACCELERATION=250.0f                 # $122
  -D DEFAULT_A_ACCELERATION=250.0f                 # $123
  -D DEFAULT_X_MAX_TRAVEL=280.0f                   # $130
  -D DEFAULT_Y_MAX_TRAVEL=200.0f                   # $131
  -D DEFAULT_Z_MAX_TRAVEL=80.0f                    # $132
  -D DEFAULT_A_MAX_TRAVEL=20000.0f                 # $133: rotary, ~unlimited
lib_deps = ${common.lib_deps}
  FatFs
  sdcard
lib_extra_dirs = ${common.lib_extra_dirs}
# Upload via ST-LINK: `pio run -e himill_d1s -t upload` (SWD probe on
# the D1S's SWD header). For a firmware-only flash that keeps HiMill's
# bootloader, write firmware.bin to flash starting at 0x08008000 (NOT
# 0x08004000 — earlier comment was wrong; verified from MaxMake reset
# vector at 0x08008148).

[env:bluepill_f103c8_128k]
board = bluepill_f103c8_128k
board_build.ldscript = STM32F103C8TX_FLASH.ld
build_flags = ${common.build_flags}
  # See Inc/my_machine.h for options
  -D BOARD_CNC3040=
  -D USB_SERIAL_CDC=0
lib_deps = ${common.lib_deps}
  eeprom
lib_extra_dirs = ${common.lib_extra_dirs}
upload_protocol = stlink

[env:bluepill_f103c8_128k_USB]
board = bluepill_f103c8_128k
board_build.ldscript = STM32F103C8TX_FLASH.ld
build_flags = ${common.build_flags}
  # See Inc/my_machine.h for options
  -D BOARD_CNC3040=
  -D NO_SETTINGS_DESCRIPTIONS=
  -D USB_SERIAL_CDC=1
lib_deps = ${common.lib_deps}
  eeprom
lib_extra_dirs = ${common.lib_extra_dirs}
upload_protocol = stlink
